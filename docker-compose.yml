version: '3.8'

services:
  frontend:
    build: ./currency-rates
    ports:
      - "4200:4200"
    depends_on:
      - backend
    environment:
      - NODE_ENV=development

  backend:
    build: ./currency-rates-api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=currency_rates

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=currency_rates
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql

volumes:
  mysql_data: 